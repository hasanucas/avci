[General]
TcpServerPort=5760
ReportStats=false
MavlinkDialect=auto

# FC — Type-C/USB. Yeni Orin'de /dev/ttyACM1 olabilir; gerekirse degistir.
[UartEndpoint fc]
Device=/dev/ttyACM0
Baud=115200

# runtracker (kcfTracker) — RC oku + OSD telemetri
[UdpEndpoint runtracker]
Mode=Server
Address=0.0.0.0
Port=14550

# Python beyin (controller_orin.py) — ATTITUDE/RC oku + RC_OVERRIDE yaz
[UdpEndpoint brain]
Mode=Server
Address=0.0.0.0
Port=14551

# QGC / Mission Planner (opsiyonel, debug) — aginizdaki PC'den TCP 5760'a da baglanabilir
[UdpEndpoint qgc]
Mode=Server
Address=0.0.0.0
Port=14552

# [14 Tem] MK15 QGC (192.168.144.20) — QGC Android varsayilan UDP 14550'yi
# dinler; router heartbeat gonderince OTOMATIK baglanir, MK15 tarafinda
# ayar gerekmez. Normal mode = router paketi .20:14550'e ITER (yerel 14550
# Server endpoint'i ile cakismaz, kaynak portu farkli).
# On kosul: .20/32 host-route enP8p1s0 uzerinde olmali (net_setup ile geliyor).
[UdpEndpoint mk15]
Mode=Normal
Address=192.168.144.20
Port=14550
